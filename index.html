<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather · Sandnes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--text:#fff;--muted:rgba(255,255,255,.68);--line:rgba(255,255,255,.16);--warm:#FFC857;--cool:#7FDBFF;--rain:#8FC8FF;--g:#0b1026;--b1:transparent;--b2:transparent}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:min(calc(100vh / 80),calc(100vw / 128))}
:root{--H:100vh;--W:100vw}
html,body{height:100%;overflow:hidden;background:#0b1026}
body{font-family:Outfit,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none}

/* ---------- themed background ---------- */
.bg{position:fixed;inset:0;background:var(--g);z-index:0}
.blob{position:fixed;width:70vw;height:70vw;border-radius:50%;z-index:0;pointer-events:none}
.blob.a{left:-20vw;top:-30vw;background:radial-gradient(circle,var(--b1) 0%,transparent 62%);animation:drift 38s ease-in-out infinite alternate}
.blob.b{right:-25vw;bottom:-35vw;background:radial-gradient(circle,var(--b2) 0%,transparent 62%);animation:drift 46s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(8vw,6vw) scale(1.15)}}
body.t-clear {--g:linear-gradient(165deg,#1746c9 0%,#2a7fe6 45%,#58aef2 78%,#ffbf86 118%);--b1:rgba(255,206,120,.55);--b2:rgba(120,210,255,.45)}
body.t-partly{--g:linear-gradient(165deg,#24479a 0%,#3f71bd 50%,#86a9d6 112%);--b1:rgba(255,212,140,.35);--b2:rgba(170,205,255,.4)}
body.t-cloudy{--g:linear-gradient(165deg,#28354f 0%,#415273 55%,#6a7da0 112%);--b1:rgba(185,200,235,.28);--b2:rgba(120,145,200,.32)}
body.t-rain  {--g:linear-gradient(165deg,#0f1b37 0%,#1b335e 50%,#2c5a86 105%);--b1:rgba(80,165,255,.38);--b2:rgba(125,95,225,.3)}
body.t-snow  {--g:linear-gradient(165deg,#283c62 0%,#4a6592 55%,#8aa4c6 112%);--b1:rgba(225,238,255,.35);--b2:rgba(160,190,255,.3)}
body.t-storm {--g:linear-gradient(165deg,#110b24 0%,#271b4b 50%,#43306d 105%);--b1:rgba(165,95,255,.38);--b2:rgba(255,205,85,.16)}
body.t-fog   {--g:linear-gradient(165deg,#364152 0%,#566275 55%,#8692a3 112%);--b1:rgba(255,255,255,.25);--b2:rgba(200,212,228,.25)}
body.t-night {--g:linear-gradient(165deg,#060a20 0%,#121845 50%,#2a2363 105%);--b1:rgba(125,95,255,.35);--b2:rgba(60,145,255,.25)}
.dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity 2s}
body.dim .dimmer{opacity:.38}

/* ---------- layout (designed for 1280x800, scales anywhere) ---------- */
.app{position:relative;z-index:1;height:var(--H);width:var(--W);display:grid;gap:1.1rem;padding:1rem 1.2rem 1.2rem;
  grid-template-columns:44% 22% 1fr;grid-template-rows:8.8rem 1fr 24.5rem;--rm:2;--rb:3}
.app.has-alert{grid-template-rows:8.8rem auto 1fr 24.5rem;--rm:3;--rb:4}
.top{grid-row:1}
.hero{grid-column:1;grid-row:var(--rm)}.bus{grid-column:2;grid-row:var(--rm)}.mapcard{grid-column:3;grid-row:var(--rm)}
.bottom{display:contents}.hstrip{grid-column:1/3;grid-row:var(--rb)}.dstrip{grid-column:3;grid-row:var(--rb)}
.card{position:relative;overflow:hidden;border-radius:2.4rem;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.05)),rgba(10,18,45,.20);
  box-shadow:0 1.2rem 3.5rem rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.18)}

/* header */
.top{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.6rem;padding:0 .8rem}
.greet{display:flex;align-items:center;gap:.6rem}
.greet h1{font-size:2.6rem;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.greet p{font-size:1.4rem;color:var(--muted);display:flex;align-items:center;gap:.6rem;margin-top:.2rem;white-space:nowrap}
.sunh{margin-left:1rem;padding-left:1rem;border-left:1px solid var(--line);color:#FFE2A3}
.greet p i{width:.8rem;height:.8rem;border-radius:50%;background:#FF6B9A;box-shadow:0 0 0 .3rem rgba(255,107,154,.25)}
@keyframes breathe{50%{transform:scale(.7);opacity:.7}}
/* big rain outlook banner */
.outlook{justify-self:center;display:flex;align-items:center;gap:1.5rem;padding:.8rem 2.2rem .8rem 1.4rem;border-radius:4.4rem;min-width:0;
  background:linear-gradient(100deg,rgba(63,214,150,.34),rgba(63,214,150,.12));border:.2rem solid rgba(120,240,190,.6);box-shadow:0 .8rem 2.6rem rgba(0,0,0,.2)}
.outlook.wet{background:linear-gradient(100deg,rgba(70,150,255,.6),rgba(112,100,240,.32));border-color:rgba(160,205,255,.85)}
.oi{width:5.6rem;height:5.6rem;flex:none}
.ot b{display:block;font-size:3.9rem;font-weight:700;letter-spacing:-.025em;line-height:1.02;white-space:nowrap;text-shadow:0 .2rem 1.2rem rgba(0,0,0,.25)}
.ot span{display:block;font-size:1.7rem;color:rgba(255,255,255,.88);margin-top:.25rem;white-space:nowrap;font-weight:500}
.otw{flex:none;width:21rem;margin-left:.4rem}
.otl{display:flex;align-items:flex-end;gap:.28rem;height:4.4rem}
.otl i{flex:1;border-radius:.45rem}
.otx{display:flex;justify-content:space-between;font-size:1.2rem;color:rgba(255,255,255,.8);margin-top:.35rem;font-weight:500}
/* warnings row */
.alerts{grid-column:1/-1;grid-row:2;display:none;gap:1rem}
.has-alert .alerts{display:flex}
.al{flex:1;display:flex;align-items:center;gap:1.2rem;padding:.55rem 1.6rem .55rem 1.2rem;border-radius:2.2rem;min-width:0;box-shadow:0 .6rem 2rem rgba(0,0,0,.25)}
.al svg{width:3.4rem;height:3.4rem;flex:none}
.al>div{min-width:0}
.al b{display:block;font-size:2.4rem;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al span{display:block;font-size:1.4rem;font-weight:500;line-height:1.2;margin-top:.1rem;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al em{margin-left:auto;flex:none;font-style:normal;font-size:1.15rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:.15rem solid currentColor;border-radius:.9rem;padding:.1rem .6rem;opacity:.7}
.al.lv1{background:#FFD33D;color:#2a2340}
.al.lv2{background:#FF9A3D;color:#2a1a10}
.al.lv3{background:#FF4D5E;color:#fff;animation:alp 2.2s ease-in-out infinite}
@keyframes alp{50%{box-shadow:0 0 0 .5rem rgba(255,77,94,.35),0 .6rem 2rem rgba(0,0,0,.25)}}
.clock{display:flex;align-items:center;gap:1.4rem}
.clock .d{text-align:right;font-size:1.5rem;color:var(--muted);line-height:1.3}
.clock .d b{display:block;color:#fff;font-weight:500;font-size:1.7rem}
.clock .t{font-size:5.4rem;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}

/* hero */
.hero{padding:1rem 1.2rem;display:grid;grid-template-columns:1.15fr 1fr;gap:1rem;min-height:0}
.hero-top{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0;min-width:0}
.hero-top .now{order:-1}
.figwrap{flex:none;height:8.4rem;width:8.4rem;margin:-.4rem 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.now{min-width:0}
.temp{font-size:18rem;font-weight:200;line-height:.82;letter-spacing:-1rem;text-shadow:0 .4rem 3rem rgba(0,0,0,.18);white-space:nowrap}
.app.has-alert .temp{font-size:14rem}
.app.has-alert .tip{margin-top:.5rem}
.temp .deg{font-weight:200;color:var(--warm);letter-spacing:0;margin-left:.3rem}
.desc{font-size:3.6rem;font-weight:500;margin-top:.6rem;letter-spacing:-.02em}
.feels{font-size:2.2rem;color:var(--muted);margin-top:.15rem}
.tip{display:inline-flex;align-items:center;gap:.8rem;margin-top:1.1rem;padding:.7rem 1.4rem .7rem 1.1rem;border-radius:1.6rem;
  background:linear-gradient(90deg,rgba(255,200,87,.28),rgba(255,126,182,.18));border:1px solid rgba(255,220,150,.35);font-size:1.45rem;font-weight:500;line-height:1.25}
.tip::before{content:"";flex:none;width:.9rem;height:.9rem;border-radius:50%;background:var(--warm);box-shadow:0 0 1rem var(--warm)}
.tile .l{font-size:1.15rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500}
.windt{display:grid;grid-template-rows:1fr auto;justify-items:center;gap:.3rem;position:relative;overflow:hidden;min-height:0;
  border-radius:1.7rem;padding:.8rem 1rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09)}
#mill{height:100%;width:100%;min-height:0;overflow:visible;position:relative;z-index:1}
.wrow{position:relative;z-index:1;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:.6rem}
.wtxt{position:relative;z-index:1;min-width:0}
.wtxt .v{font-size:3.5rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.wtxt .v small{font-size:1.4rem;color:var(--muted);font-weight:400}
.wtxt .s{white-space:nowrap;font-size:1.4rem;color:var(--muted);margin-top:.3rem;display:flex;align-items:center;gap:.5rem;line-height:1.15}
.wtxt .s b{color:#fff;font-weight:500}
#dirArrow{width:1.7rem;height:1.7rem;transition:transform 1s}
.streak{position:absolute;height:2px;width:5rem;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
  animation:streak var(--sd,3s) linear infinite;opacity:var(--so,.3);z-index:0}
@keyframes streak{from{transform:translateX(-7rem)}to{transform:translateX(50rem)}}

/* bus */
.bus{display:flex;flex-direction:column;padding:1.4rem 1.4rem 1rem;min-height:0}
.bhead{display:flex;align-items:center;gap:.9rem;margin-bottom:.6rem}
.bhead svg{width:2.6rem;height:2.6rem;flex:none}
.bhead b{display:block;font-size:1.9rem;font-weight:600;line-height:1.1}
.bhead span{display:block;font-size:1.3rem;color:var(--muted)}
#busList{display:flex;flex-direction:column;flex:1;min-height:0}
.brow{flex:1;display:flex;align-items:center;gap:1rem;border-top:1px solid rgba(255,255,255,.13);font-variant-numeric:tabular-nums;min-height:0}
.bn{flex:none;min-width:4.6rem;text-align:center;padding:.2rem .6rem;border-radius:1rem;background:var(--warm);color:#1a1a2e;font-size:2.2rem;font-weight:700}
.bw{font-size:3.6rem;font-weight:600;letter-spacing:-.02em;line-height:1}
.bt{margin-left:auto;text-align:right;font-size:1.6rem;color:var(--muted);font-weight:500;line-height:1.2}
.bt .late{display:block;color:#FF9A9A;font-size:1.35rem}
.bt .dst{display:block;font-size:1.15rem;max-width:9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow.first .bw{color:#fff}
.brow.go .bw{color:#5EE6A0;animation:breathe 1.2s ease-in-out infinite}
.brow:not(.first){opacity:.85}
.bmsg{font-size:1.8rem;color:var(--muted);padding-top:1rem}

/* map */
.mapcard{background:#0b1426}
#map{position:absolute;inset:0;background:#0b1426}
.mtag{position:absolute;z-index:500;left:1.4rem;top:1.4rem;display:flex;align-items:center;gap:.8rem;padding:.7rem 1.4rem;border-radius:99rem;
  background:rgba(8,14,30,.72);border:1px solid var(--line);font-size:1.5rem;font-weight:500}
.mtag b{color:var(--cool);font-weight:600;font-variant-numeric:tabular-nums}
.mtag .lv{width:.9rem;height:.9rem;border-radius:50%;background:#ff4d6d;animation:breathe 1.6s infinite}
.legend{position:absolute;z-index:500;right:1.4rem;top:1.4rem;display:flex;align-items:center;gap:.8rem;padding:.7rem 1.2rem;border-radius:99rem;
  background:rgba(8,14,30,.72);border:1px solid var(--line);font-size:1.2rem;color:var(--muted)}
.legend i{display:block;width:9rem;height:.7rem;border-radius:.4rem;background:linear-gradient(90deg,#a7e3ff,#3c96ff,#1543c9,#ffd400,#ff3b3b)}
.tl{position:absolute;z-index:500;left:1.4rem;right:1.4rem;bottom:1.4rem;display:flex;gap:.4rem;padding:.8rem 1rem;border-radius:99rem;background:rgba(8,14,30,.72);border:1px solid var(--line)}
.tl i{flex:1;height:.6rem;border-radius:.3rem;background:rgba(255,255,255,.18);transition:background .3s}
.tl i.fc{background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 4px,transparent 4px 7px)}
.tl i.on{background:var(--cool);box-shadow:0 0 .8rem var(--cool)}
.home{position:relative}
.home span{position:absolute;inset:0;border-radius:50%;background:#FF5D8F;border:3px solid #fff;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,143,.7)}100%{box-shadow:0 0 0 22px rgba(255,93,143,0)}}
.leaflet-container{font-family:inherit;background:#0b1426}
.leaflet-control-attribution{font-size:9px!important;background:rgba(8,14,30,.55)!important;color:#7d8aa3!important;margin-bottom:5.2rem!important;border-radius:6px 0 0 6px}
.leaflet-control-attribution a{color:#7d8aa3!important}

/* bottom */
.strip{padding:1.1rem 1.2rem 1rem;display:flex;flex-direction:column}
.ct{font-size:1.2rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 .3rem .8rem}
.hgrid{position:relative;flex:1;display:grid;grid-template-columns:repeat(12,1fr)}
.hc{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;border-radius:1.5rem;background:rgba(80,165,255,var(--rt,0))}
.hc.now{background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),rgba(80,165,255,var(--rt,0));box-shadow:inset 0 0 0 .15rem rgba(255,255,255,.3)}
.ht{height:2.2rem;font-size:1.55rem;color:var(--muted);display:flex;align-items:center;font-variant-numeric:tabular-nums}
.hc.now .ht{color:#fff;font-weight:600}
.hi{height:4rem;width:4rem}
.hs{position:relative;height:6.4rem;width:100%}
.hw{height:2rem;font-size:1.3rem;color:var(--muted);display:flex;align-items:center;white-space:nowrap}
.tlab{position:absolute;left:50%;transform:translate(-50%,-140%);font-size:2.1rem;font-weight:500;white-space:nowrap}
.hd{position:absolute;left:50%;width:1rem;height:1rem;margin:-.5rem 0 0 -.5rem;border-radius:50%;background:#fff;box-shadow:0 0 0 .35rem rgba(255,255,255,.2)}
.hr{height:5.6rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.15rem}
.bar{width:2rem;border-radius:.65rem;background:linear-gradient(to top,#2f7bff,#9ad6ff)}
.hr em{font-style:normal;font-size:1.6rem;color:#cfe8ff;height:1.8rem;font-weight:700}
.curve{position:absolute;left:0;top:6.2rem;width:100%;height:6.4rem;z-index:0;pointer-events:none;overflow:visible}
.dgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);min-height:0}
.dc{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.3rem 0 .2rem;border-radius:1.5rem}
.dc{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s}
.dc.today{background:rgba(255,255,255,.11)}
.dc.sel{background:rgba(255,255,255,.26)!important;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.dn{font-size:1.45rem;font-weight:500}
.di{width:3.8rem;height:3.8rem}
.dmax{font-size:1.9rem;font-weight:600}
.dtrack{position:relative;width:1rem;flex:1;max-height:4.4rem;min-height:2.4rem;border-radius:.5rem;background:rgba(255,255,255,.12);margin:.3rem 0}
.dtrack span{position:absolute;left:0;right:0;border-radius:.5rem}
.dmin{font-size:1.6rem;color:var(--muted)}
.dp{font-size:1.15rem;color:var(--rain);height:1.4rem;font-weight:500}
.wi{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .3rem .6rem rgba(0,0,0,.18))}

.status{position:fixed;left:1.6rem;bottom:.3rem;font-size:1rem;color:rgba(255,255,255,.35);z-index:60}
.toast{position:fixed;left:24%;top:46rem;transform:translate(-50%,-1rem);opacity:0;z-index:70;padding:1rem 2rem;border-radius:99rem;
  background:rgba(8,14,30,.85);border:1px solid var(--line);font-size:1.6rem;font-weight:500;transition:all .35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- the little weather buddy ---------- */
#fig{width:100%;height:100%;overflow:visible}
#fig .sc,#fig .acc,#fig .mouth{display:none}
#fig.sun #sSun,#fig.moon #sMoon,#fig.clouds #sCloud,#fig.storm #sBolt,#fig.fog #sFog{display:inline}
#fig #mSmile{display:inline}
#fig.grin #mSmile,#fig.oh #mSmile{display:none}
#fig.grin #mGrin,#fig.oh #mO{display:inline}
#fig.shades #aGlasses,#fig.scarf #aScarf,#fig.beanie #aBeanie,#fig.salakot #aSalakot{display:inline}
#fig.rain #aUmb,#fig.rain #aUmbArm{display:inline}
#fig.rain #armR{display:none}
#fig.sleepy #eyesSleep,#fig.sleepy #zzz{display:inline}
#fig.sleepy #eyesOpen,#fig.sleepy #aGlasses,#fig.sleepy #bubble{display:none}
#fig .scl{fill:rgba(255,255,255,.93)}
#fig.rain .scl{fill:#C9D3E4}#fig.storm .scl{fill:#8E96AE}#fig.snow .scl{fill:#E8EEF7}
#fig .shoe{fill:#4F5FE0}#fig.rain .shoe{fill:#2FD08A}#fig.snow .shoe{fill:#9A6544}
#bob{animation:bob 2.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
#fig.windy #sway{animation:sway 1.3s ease-in-out infinite alternate;transform-origin:110px 216px}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(4deg)}}
#eyesOpen{transform-origin:110px 128px;animation:blink 5s infinite}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
#armL{transform-origin:62px 150px;animation:wave 8s ease-in-out infinite}
@keyframes wave{0%,62%,96%,100%{transform:rotate(0)}68%{transform:rotate(118deg)}72%{transform:rotate(92deg)}76%{transform:rotate(118deg)}80%{transform:rotate(92deg)}84%{transform:rotate(118deg)}90%{transform:rotate(0)}}
#bubble{opacity:0;animation:bubble 8s ease-in-out infinite;transform-origin:40px 70px}
@keyframes bubble{0%,63%,92%,100%{opacity:0;transform:scale(.6)}68%,86%{opacity:1;transform:scale(1)}}
.rays{transform-origin:195px 48px;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dr1{animation:dr 9s ease-in-out infinite alternate}.dr2{animation:dr 12s ease-in-out infinite alternate-reverse}
@keyframes dr{to{transform:translateX(12px)}}
.star{animation:tw 3s ease-in-out infinite}.star:nth-child(2n){animation-delay:-1.5s}
@keyframes tw{50%{opacity:.2}}
#sBolt{animation:flash 4.5s infinite}
@keyframes flash{0%,86%,100%{opacity:0}88%,92%{opacity:1}90%{opacity:.15}}
.drop{stroke:#A9D6FF;stroke-width:2.4;stroke-linecap:round;opacity:.85;animation:fall 1s linear infinite}
@keyframes fall{to{transform:translate(-30px,275px)}}
.flake{fill:#fff;opacity:.95;animation:snowf 6s linear infinite}
@keyframes snowf{50%{transform:translate(14px,135px)}100%{transform:translate(-6px,270px)}}
.fogb{fill:rgba(255,255,255,.32);animation:dr 7s ease-in-out infinite alternate}
.fogb:nth-child(2){animation-duration:9s;animation-direction:alternate-reverse}
#zzz text{font:700 18px Outfit,sans-serif;fill:#fff;animation:zz 3s ease-in infinite;opacity:0}
#zzz text:nth-child(2){animation-delay:1s}#zzz text:nth-child(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-30px)}}
#fig.windy .tail{animation:flutter .45s ease-in-out infinite alternate;transform-origin:131px 176px}
@keyframes flutter{from{transform:rotate(-30deg)}to{transform:rotate(8deg)}}

.hbtn{background:none;border:0;padding:.7rem;margin:-.7rem -.1rem -.7rem -.7rem;cursor:pointer;display:flex;-webkit-tap-highlight-color:transparent}
.hbtn svg{width:1.15rem;height:1.05rem;filter:drop-shadow(0 0 .4rem rgba(255,107,154,.6));animation:hb 2.6s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.18)}48%{transform:scale(1)}}
#love{position:fixed;inset:0;z-index:999;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .5s;background:radial-gradient(circle at 50% 50%,rgba(255,80,140,.28),rgba(40,10,50,.55))}
#love.on{opacity:1}
.fh{position:absolute;bottom:-12%;left:var(--x);font-size:var(--s);line-height:1;animation:fly var(--d) ease-in var(--dl) forwards;opacity:0;filter:drop-shadow(0 0 .6rem rgba(255,120,170,.7))}
@keyframes fly{0%{transform:translate(0,0) rotate(-12deg) scale(.5);opacity:0}12%{opacity:1}50%{transform:translate(var(--w),-60vh) rotate(14deg) scale(1)}100%{transform:translate(calc(var(--w)*-.6),-125vh) rotate(-10deg) scale(1.1);opacity:.9}}
.lovemsg{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.2);text-align:center;opacity:0;white-space:nowrap}

@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-6deg);opacity:0}10%{transform:translate(-50%,-50%) scale(1.08) rotate(2deg);opacity:1}18%{transform:translate(-50%,-50%) scale(1) rotate(-1deg)}50%{transform:translate(-50%,-52%) scale(1.04) rotate(1.5deg)}85%{transform:translate(-50%,-50%) scale(1) rotate(-1deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  // ===== Fit to the visible screen (Silk's toolbar steals height) + fullscreen on tap =====
  const FIT = parseFloat((location.search.match(/fit=([\d.]+)/)||[])[1]) || 0.97;
  function fit(){
    const vv=window.visualViewport, H=Math.floor((vv?vv.height:window.innerHeight)*FIT), W=Math.floor((vv?vv.width:window.innerWidth));
    const r=document.documentElement;
    r.style.setProperty('--H',H+'px'); r.style.setProperty('--W',W+'px');
    r.style.fontSize=Math.min(H/80,W/128)+'px';
  }
  fit(); addEventListener('resize',fit); addEventListener('orientationchange',fit);
  if(window.visualViewport) visualViewport.addEventListener('resize',fit);
  setTimeout(fit,500); setTimeout(fit,2000);
  function goFull(){
    const e=document.documentElement, f=e.requestFullscreen||e.webkitRequestFullscreen||e.mozRequestFullScreen;
    try{ if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else if(f){ f.call(e); } }catch(x){}
    setTimeout(fit,400); setTimeout(fit,1500);
  }
  document.addEventListener('fullscreenchange',()=>setTimeout(fit,300));
  document.addEventListener('webkitfullscreenchange',()=>setTimeout(fit,300));
  // ===== Location: Sandnes area (rounded to ~1 km on purpose) =====
  const LAT = 58.84, LON = 5.78;
  // ===== Temperature correction for our spot (higher up / colder than the model grid) =====
  // Applied to all temperatures. Tune here, or test with ?adj=-3 in the address.
  const TEMP_ADJ = parseFloat((location.search.match(/adj=(-?[\d.]+)/)||[])[1]) || -2;
  const REFRESH_MIN = 10;

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const DEMO = /demo/.test(location.search);

  const WTXT = {0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Freezing fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunder & hail',99:'Thunder & hail'};
  const isRain  = c => (c>=51&&c<=67)||(c>=80&&c<=82);
  const isSnow  = c => (c>=71&&c<=77)||c===85||c===86;
  const isStorm = c => c>=95;
  const isFog   = c => c===45||c===48;

  // ---------- custom SVG weather icons ----------
  const f1 = n => n.toFixed(1);
  function sun(cx,cy,r){
    let s='';
    for(let a=0;a<360;a+=45){const t=a*Math.PI/180;
      s+=`<line x1="${f1(cx+Math.cos(t)*(r+4))}" y1="${f1(cy+Math.sin(t)*(r+4))}" x2="${f1(cx+Math.cos(t)*(r+8.5))}" y2="${f1(cy+Math.sin(t)*(r+8.5))}" stroke="#FFC94A" stroke-width="3.2" stroke-linecap="round"/>`;}
    return s+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFC94A"/><circle cx="${f1(cx-r*.3)}" cy="${f1(cy-r*.3)}" r="${f1(r*.45)}" fill="#FFE59A" opacity=".7"/>`;
  }
  const moon = (cx,cy,r) => `<path transform="rotate(-20 ${cx} ${cy})" d="M${cx} ${cy-r} A${r} ${r} 0 1 0 ${cx} ${cy+r} A${f1(r*1.25)} ${f1(r*1.25)} 0 0 1 ${cx} ${cy-r} Z" fill="#EDEBFF"/>`;
  const cloud = (x,y,s,fill) => `<path transform="translate(${x} ${y}) scale(${s})" d="M18 48a10 10 0 0 1-1-20a14 14 0 0 1 27-4a11 11 0 0 1 6 24z" fill="${fill}"/>`;
  const drops = (n,col) => [22,32,42,27,37].slice(0,n).map((x,i)=>`<line x1="${x+(i>2?0:0)}" y1="${i>2?54:50}" x2="${x-3}" y2="${i>2?62:58}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`).join('');
  const flakes = () => [[22,53],[32,58],[42,53],[27,62],[37,62]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="#fff"/>`).join('');
  function ico(code, night){
    let s='';
    const cel = (x,y,r) => night ? moon(x,y,r+2) : sun(x,y,r);
    if(code<=1){ s = cel(32,30,13); if(code===1) s += cloud(24,22,.55,'#F4F7FB'); }
    else if(code===2){ s = cel(23,22,9) + cloud(5,8,1,'#F4F7FB'); }
    else if(code===3){ s = cloud(-4,0,.72,'#AFBBD0') + cloud(6,8,1,'#EEF2F8'); }
    else if(isFog(code)){ s = cloud(5,-4,1,'#D3DAE6') + '<path d="M12 52h40M18 59h30" stroke="#E6EBF3" stroke-width="3.2" stroke-linecap="round"/>'; }
    else {
      const storm=isStorm(code), heavy=[55,65,67,82,75,86].includes(code);
      if(!night && (code>=80&&code<=86)) s += sun(46,14,8);
      s += cloud(5,-4,1, storm?'#8C95AC':heavy?'#B4BFD1':'#E9EEF6');
      if(storm) s += '<polygon points="34,40 24,54 31,54 26,64 41,47 33,47 38,40" fill="#FFD84A"/>';
      if(isSnow(code)) s += flakes();
      else if(storm) s += drops(2,'#7CB8FF');
      else s += drops(code<=57?2:heavy?5:3,'#7CB8FF');
    }
    return `<svg class="wi" viewBox="0 0 64 64">${s}</svg>`;
  }

  // ---------- helpers ----------
  const COMP = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  const compass = d => COMP[Math.round(d/22.5)%16];
  const BEAU = [[0.3,'Calm'],[1.6,'Light air'],[3.4,'Light breeze'],[5.5,'Gentle breeze'],[8,'Moderate breeze'],[10.8,'Fresh breeze'],[13.9,'Strong breeze'],[17.2,'Near gale'],[20.8,'Gale'],[24.5,'Strong gale'],[28.5,'Storm'],[32.7,'Violent storm'],[999,'Hurricane']];
  const beaufort = ws => BEAU.find(b=>ws<b[0])[1];
  const TSTOPS = [[-10,[138,180,255]],[0,[127,219,255]],[8,[94,230,181]],[15,[255,209,102]],[25,[255,140,90]]];
  function tcol(t){
    if(t<=TSTOPS[0][0]) return `rgb(${TSTOPS[0][1]})`;
    for(let i=1;i<TSTOPS.length;i++){ if(t<=TSTOPS[i][0]){
      const [t0,c0]=TSTOPS[i-1],[t1,c1]=TSTOPS[i],k=(t-t0)/(t1-t0);
      return `rgb(${c0.map((v,j)=>Math.round(v+(c1[j]-v)*k))})`; } }

    if(j.__adj||!TEMP_ADJ) return; j.__adj=1;
    const a=v=>v==null?v:v+TEMP_ADJ;
    j.current.temperature_2m=a(j.current.temperature_2m); j.current.apparent_temperature=a(j.current.apparent_temperature);
    j.hourly.temperature_2m=j.hourly.temperature_2m.map(a);
    j.daily.temperature_2m_max=j.daily.temperature_2m_max.map(a); j.daily.temperature_2m_min=j.daily.temperature_2m_min.map(a);
  }
  function render(j){
    adjustTemps(j);
    const c=j.current, H=j.hourly, D=j.daily;
    live={code:c.weather_code,day:!!c.is_day,t:c.temperature_2m,ws:c.wind_speed_10m,gust:c.wind_gusts_10m,hour:new Date().getHours()};
    if(di<0) applyLook(live);
    $('nTemp').textContent=Math.round(c.temperature_2m);
    $('nDesc').textContent=WTXT[c.weather_code]||'—';
    $('nFeels').textContent=`Feels ${Math.round(c.apparent_temperature)}°  ·  H ${Math.round(D.temperature_2m_max[0])}°  L ${Math.round(D.temperature_2m_min[0])}°`;
    $('nWind').textContent=f1(c.wind_speed_10m);
    $('nGust').textContent=Math.round(c.wind_gusts_10m)+' m/s';
    $('nBeau').textContent=beaufort(c.wind_speed_10m);
    $('nDir').textContent='from '+compass(c.wind_direction_10m);
    $('dirArrow').style.transform=`rotate(${c.wind_direction_10m+180}deg)`;
    let s=H.time.findIndex(t=>t.slice(0,13)===c.time.slice(0,13)); if(s<0) s=0;
    $('nHum').textContent=Math.round(c.relative_humidity_2m)+'%';
    $('sRise').textContent=D.sunrise[0].slice(11,16); $('sSet').textContent=D.sunset[0].slice(11,16);
    view={H,D,s}; drawHours(); renderDaily(D);
    drawOutlook(j,s); derivedAlerts=deriveAlerts(j,s); drawAlerts();
    const n=new Date(); $('status').textContent=(DEMO?'Demo data · ':'Updated ')+pad(n.getHours())+':'+pad(n.getMinutes());
  }

  // ---------- data (Open-Meteo, no key) ----------
  const base=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,is_day,wind_speed_10m,wind_gusts_10m,wind_direction_10m`+
    `&hourly=temperature_2m,precipitation,weather_code,is_day,wind_speed_10m,wind_gusts_10m`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset`+
    `&wind_speed_unit=ms&timezone=Europe%2FOslo&forecast_days=7`;
  const getJ=u=>fetch(u).then(r=>{if(!r.ok) throw new Error(r.status); return r.json();});
  function loadWeather(){
    if(DEMO){ render(fakeData()); return; }
    getJ(base+'&minutely_15=precipitation&forecast_minutely_15=24')
      .catch(()=>getJ(base))
      .then(render)
      .catch(()=>{ $('status').textContent='Weather offline — retrying'; setTimeout(loadWeather,60000); });
  }
  function fakeData(){
    const now=new Date(), d0=new Date(now); d0.setHours(0,0,0,0);
    const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const WARN=/warn/.test(location.search);
    const H={time:[],temperature_2m:[],precipitation:[],weather_code:[],is_day:[],wind_speed_10m:[],wind_gusts_10m:[]};
    for(let i=0;i<168;i++){ const d=new Date(d0.getTime()+i*36e5), h=d.getHours(), p=Math.max(0,Math.sin(i/5)*1.8-.6);
      H.time.push(iso(d)); H.temperature_2m.push((WARN?-1.5:6)+3*Math.sin((h-9)/24*2*Math.PI)+Math.sin(i/30)*2);
      H.precipitation.push(+p.toFixed(1)); H.weather_code.push(p>1?63:p>0?61:i%7<3?2:3); H.is_day.push(h>=8&&h<16?1:0); H.wind_speed_10m.push(5+4*Math.sin(i/7)); H.wind_gusts_10m.push(WARN?26+3*Math.sin(i/5):10+5*Math.sin(i/7)); }
    const D={time:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[],precipitation_sum:[],sunrise:[],sunset:[]};
    for(let d=0;d<7;d++){ const s=H.temperature_2m.slice(d*24,d*24+24), ds=iso(new Date(d0.getTime()+d*864e5)).slice(0,10);
      D.time.push(ds); D.temperature_2m_max.push(Math.max(...s)+d%3); D.temperature_2m_min.push(Math.min(...s)-d%2);
      D.precipitation_sum.push(H.precipitation.slice(d*24,d*24+24).reduce((a,b)=>a+b,0)); D.weather_code.push([61,3,2,63,0,80,71][d]);
      D.sunrise.push(ds+'T08:41'); D.sunset.push(ds+'T16:12'); }
    const q0=Math.floor(now/9e5)*9e5, M={time:[],precipitation:[]};
    for(let k=0;k<24;k++){ M.time.push(iso(new Date(q0+k*9e5))); M.precipitation.push(+Math.max(0,Math.sin((k-3)/3.2)*.9-.25).toFixed(2)); }
    const ci=now.getHours();
    return {minutely_15:M,current:{time:iso(new Date(Math.floor(now/9e5)*9e5)),temperature_2m:H.temperature_2m[ci],apparent_temperature:H.temperature_2m[ci]-3,relative_humidity_2m:84,
      precipitation:H.precipitation[ci],weather_code:63,is_day:1,wind_speed_10m:7.4,wind_gusts_10m:12.6,wind_direction_10m:225},hourly:H,daily:D};
  }

  // ---------- bus: next departures to Sandnes (Entur open API, no key) ----------
  const BUS_STOP='NSR:StopPlace:26271', BUS_WORDS=['sandnes'];   // stop = Kleivabergsbakken
  let busCalls=null, busAll=false;
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function renderBus(){
    const el=$('busList'); if(!busCalls){ return; }
    const now=Date.now(), mins=c=>(new Date(c.expectedDepartureTime)-now)/60000;
    let list=busCalls.filter(c=>!c.cancellation && mins(c)>=-0.5);
    const to=list.filter(c=>BUS_WORDS.some(w=>(c.destinationDisplay&&c.destinationDisplay.frontText||'').toLowerCase().includes(w)));
    busAll = to.length===0 && list.length>0;
    $('busStop').textContent = 'Kleivabergsbakken'+(busAll?' · all directions':'');
    list=(busAll?list:to).slice(0,4);
    if(!list.length){ el.innerHTML='<div class="bmsg">No buses soon</div>'; return; }
    el.innerHTML=list.map((c,k)=>{
      const exp=new Date(c.expectedDepartureTime), aim=new Date(c.aimedDepartureTime);
      const m=Math.round(mins(c)), delay=Math.round((exp-aim)/60000), late=c.realtime&&delay>=2;
      const clock=pad(exp.getHours())+':'+pad(exp.getMinutes());
      const big=m<=0?'Now':m<=60?m+' min':clock;
      const dest=(c.destinationDisplay&&c.destinationDisplay.frontText)||'';
      const line=(c.serviceJourney&&c.serviceJourney.line&&c.serviceJourney.line.publicCode)||'?';
      const right=(m<=60?clock:'')+(late?`<span class="late">+${delay} min late</span>`:'')+(busAll?`<span class="dst">${esc(dest)}</span>`:'');
      return `<div class="brow${k?'':' first'}${m<=1?' go':''}"><span class="bn">${esc(line)}</span><span class="bw">${big}</span><span class="bt">${right}</span></div>`;
    }).join('');
  }
  function loadBus(){
    if(DEMO){ const t=n=>new Date(Date.now()+n*60000).toISOString();
      busCalls=[{expectedDepartureTime:t(4),aimedDepartureTime:t(4),realtime:true,destinationDisplay:{frontText:'Sandnes sentrum'},serviceJourney:{line:{publicCode:'9'}}},
        {expectedDepartureTime:t(19),aimedDepartureTime:t(17),realtime:true,destinationDisplay:{frontText:'Sandnes'},serviceJourney:{line:{publicCode:'9'}}},
        {expectedDepartureTime:t(34),aimedDepartureTime:t(34),realtime:false,destinationDisplay:{frontText:'Sandnes sentrum'},serviceJourney:{line:{publicCode:'9'}}},
        {expectedDepartureTime:t(78),aimedDepartureTime:t(78),realtime:false,destinationDisplay:{frontText:'Sandnes sentrum'},serviceJourney:{line:{publicCode:'28'}}}];
      renderBus(); return; }
    const q=`{stopPlace(id:"${BUS_STOP}"){estimatedCalls(numberOfDepartures:40,timeRange:14400){expectedDepartureTime aimedDepartureTime realtime cancellation destinationDisplay{frontText} serviceJourney{line{publicCode}}}}}`;
    fetch('https://api.entur.io/journey-planner/v3/graphql',{method:'POST',headers:{'Content-Type':'application/json','ET-Client-Name':'dingerst-weather-dashboard'},body:JSON.stringify({query:q})})
      .then(r=>{if(!r.ok) throw new Error(r.status); return r.json();})
      .then(j=>{ busCalls=j.data.stopPlace.estimatedCalls; renderBus(); })
      .catch(()=>{ if(!busCalls) $('busList').innerHTML='<div class="bmsg">Bus times offline</div>'; });
  }
  loadBus(); setInterval(loadBus,60000); setInterval(renderBus,15000);

  // ---------- map + radar (RainViewer) ----------
  let map=null;
  try{
    map=L.map('map',{zoomControl:false,attributionControl:true,minZoom:5,maxZoom:9}).setView([LAT+.15,LON-.55],7);
    map.createPane('labels'); map.getPane('labels').style.zIndex=650; map.getPane('labels').style.pointerEvents='none';
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:9,maxZoom:9,attribution:'Map © Esri, HERE, Garmin, OpenStreetMap contributors · Radar © RainViewer · Forecast © Open-Meteo'}).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:9,maxZoom:9,pane:'labels'}).addTo(map);
    L.marker([LAT,LON],{icon:L.divIcon({className:'home',html:'<span></span>',iconSize:[18,18]}),interactive:false}).addTo(map);
  }catch(e){}
  // Current radar (latest frame only) + forecast precipitation for the next 6 hours (Open-Meteo model grid).
  const GRID={lon0:1.2,dlon:.8,nx:11,lat0:57.6,dlat:.45,ny:7};
  const GB={w:GRID.lon0,e:GRID.lon0+GRID.dlon*(GRID.nx-1),s:GRID.lat0,n:GRID.lat0+GRID.dlat*(GRID.ny-1)};
  let frames=[], fi=0, tmr=null, radarLayer=null, extra=[], model=null, modelAt=0;
  const mer=l=>Math.log(Math.tan(Math.PI/4+l*Math.PI/360)), imer=y=>(2*Math.atan(Math.exp(y))-Math.PI/2)*180/Math.PI;
  const STOPS=[[0.1,[167,227,255,.30]],[0.5,[60,150,255,.60]],[1.5,[21,67,201,.78]],[4,[255,212,0,.85]],[9,[255,59,59,.9]]];
  function pcol(v){
    if(v<0.03) return [0,0,0,0];
    if(v<0.1) return [167,227,255,.30*(v-.03)/.07];
    for(let i=1;i<STOPS.length;i++) if(v<=STOPS[i][0]){ const [a,ca]=STOPS[i-1],[b,cb]=STOPS[i],k=(v-a)/(b-a); return ca.map((x,j)=>x+(cb[j]-x)*k); }
    return STOPS[STOPS.length-1][1];
  }
  function drawGrid(g){        // g[row][col] mm/h -> smooth PNG overlay
    const W=200,H=150, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx=cv.getContext('2d'), im=ctx.createImageData(W,H), yN=mer(GB.n), yS=mer(GB.s);
    for(let y=0;y<H;y++){
      const lat=imer(yN+(yS-yN)*(y+.5)/H), fr=(lat-GRID.lat0)/GRID.dlat, r0=Math.max(0,Math.min(GRID.ny-2,Math.floor(fr))), ty=Math.max(0,Math.min(1,fr-r0));
      for(let x=0;x<W;x++){
        const lon=GB.w+(GB.e-GB.w)*(x+.5)/W, fc=(lon-GRID.lon0)/GRID.dlon, c0=Math.max(0,Math.min(GRID.nx-2,Math.floor(fc))), tx=Math.max(0,Math.min(1,fc-c0));
        const v=(g[r0][c0]*(1-tx)+g[r0][c0+1]*tx)*(1-ty)+(g[r0+1][c0]*(1-tx)+g[r0+1][c0+1]*tx)*ty;
        const c=pcol(v), o=(y*W+x)*4; im.data[o]=c[0]; im.data[o+1]=c[1]; im.data[o+2]=c[2]; im.data[o+3]=Math.round(c[3]*255);
      }
    }
    ctx.putImageData(im,0,0); return cv.toDataURL('image/png');
  }
  function loadModel(){
    if(model && Date.now()-modelAt<50*60000) return Promise.resolve(model);
    const lats=[],lons=[]; for(let r=0;r<GRID.ny;r++) for(let c=0;c<GRID.nx;c++){ lats.push((GRID.lat0+r*GRID.dlat).toFixed(2)); lons.push((GRID.lon0+c*GRID.dlon).toFixed(2)); }
    if(DEMO){ const times=[...Array(8)].map((_,k)=>{const d=new Date(Math.floor(Date.now()/36e5)*36e5+k*36e5); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':00';});
      const grids=times.map((_,k)=>{const g=[]; for(let r=0;r<GRID.ny;r++){g.push([]); for(let c=0;c<GRID.nx;c++) g[r].push(Math.max(0,3.2*Math.sin((c+k*.9)/1.9)*Math.cos((r-k*.4)/1.4)-.5));} return g;});
      model={times,grids}; modelAt=Date.now(); return Promise.resolve(model); }
    return getJ(`https://api.open-meteo.com/v1/forecast?latitude=${lats.join(',')}&longitude=${lons.join(',')}&hourly=precipitation&forecast_hours=9&timezone=Europe%2FOslo`)
      .then(j=>{ const arr=Array.isArray(j)?j:[j], times=arr[0].hourly.time, grids=times.map((_,k)=>{const g=[]; for(let r=0;r<GRID.ny;r++){g.push([]); for(let c=0;c<GRID.nx;c++) g[r].push(arr[r*GRID.nx+c].hourly.precipitation[k]||0);} return g;});
        model={times,grids}; modelAt=Date.now(); return model; });
  }
  function showF(i){
    frames.forEach((f,k)=>f.layer.setOpacity(k===i?f.op:0)); fi=i;
    $('radarTime').textContent=frames[i].label;
    [...$('tl').children].forEach((el,k)=>el.classList.toggle('on',k===i));
  }
  function loop(){
    clearTimeout(tmr); if(frames.length<2) return;
    tmr=setTimeout(()=>{ showF((fi+1)%frames.length); loop(); }, fi===frames.length-1?1800:(fi===0?2200:1100));
  }
  function build(radar,mdl){
    if(radarLayer){ map.removeLayer(radarLayer); radarLayer=null; } extra.forEach(l=>map.removeLayer(l)); extra=[]; frames=[];
    const now=Date.now(), pt=t=>new Date(t);
    if(radar){ radarLayer=L.tileLayer(radar.host+radar.f.path+'/256/{z}/{x}/{y}/2/1_1.png',{opacity:0,maxNativeZoom:7,maxZoom:9,zIndex:10}).addTo(map); const d=new Date(radar.f.time*1000);
      frames.push({layer:radarLayer,op:.8,label:'Now · radar '+pad(d.getHours())+':'+pad(d.getMinutes())}); }
    if(mdl){
      let ks=mdl.times.map((t,k)=>k).filter(k=>pt(mdl.times[k])>now-30*60000 ? (pt(mdl.times[k])>now || (!radar && now-pt(mdl.times[k])<36e5)) : false).slice(0,radar?6:7);
      ks.forEach(k=>{ const t=pt(mdl.times[k]), h=Math.round((t-now)/36e5), ov=L.imageOverlay(drawGrid(mdl.grids[k]),[[GB.s,GB.w],[GB.n,GB.e]],{opacity:0,zIndex:20,interactive:false}).addTo(map);
        extra.push(ov); frames.push({layer:ov,op:.9,fc:1,label:(h<=0?'Now':'Forecast +'+h+' h')+' · '+pad(t.getHours())+':00'}); });
    }
    if(!frames.length){ $('radarTime').textContent='no data'; return; }
    $('tl').innerHTML=frames.map((f,i)=>`<i class="${f.fc?'fc':''}"></i>`).join('');
    showF(0); loop();
  }
  function loadRadar(){
    if(!map) return;
    const rp=DEMO?Promise.resolve(null):getJ('https://api.rainviewer.com/public/weather-maps.json').then(j=>{ const past=(j.radar&&j.radar.past)||[]; return past.length?{host:j.host,f:past[past.length-1]}:null; }).catch(()=>null);
    Promise.all([rp,loadModel().catch(()=>model)]).then(r=>build(r[0],r[1]));
  }

  function refresh(){ loadWeather(); loadRadar(); loadAlerts(); }
  refresh(); setInterval(refresh, REFRESH_MIN*60*1000);
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
})();
</script>
